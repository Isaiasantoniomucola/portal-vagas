# /etc/nginx/sites-available/vagas  (substitua seudominio.ao)
# Certificado: sudo certbot --nginx -d seudominio.ao -d www.seudominio.ao
server {
    listen 80;
    server_name seudominio.ao www.seudominio.ao;
    return 301 https://seudominio.ao$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seudominio.ao;

    ssl_certificate     /etc/letsencrypt/live/seudominio.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.ao/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
